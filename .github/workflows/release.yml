name: Signed stable release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      # Official immutable SHAs: checkout v4.2.2, setup-python v5.6.0,
      # upload-artifact v4.6.0 and download-artifact v4.1.8.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Pin build and test tools
        run: python -m pip install pip==24.3.1 setuptools==75.8.0 wheel==0.45.1 build==1.2.2.post1 pytest==8.3.5
      - name: Verify tag, commit, version and release metadata
        run: |
          set -euo pipefail
          test "$(git rev-list -n1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          python - <<'PY'
          import json,os,pathlib,re
          tag=os.environ["GITHUB_REF_NAME"]
          assert re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)",tag)
          ns={}; exec(pathlib.Path("src/open_dachs_manager/__init__.py").read_text(),ns)
          version=ns["__version__"]; assert tag=="v"+version
          metadata=json.loads(pathlib.Path("release-metadata.json").read_text())
          assert metadata["schema"]=="open-dachs-release-metadata/v1"
          item=metadata["releases"][version]
          assert set(item)=={"auto_eligible","db_schema_from","db_schema_to","min_helper_version","rollback_compatible"}
          assert type(item["auto_eligible"]) is bool and type(item["rollback_compatible"]) is bool
          assert type(item["db_schema_from"]) is int and type(item["db_schema_to"]) is int
          assert re.fullmatch(r"\d+\.\d+\.\d+",item["min_helper_version"])
          PY
      - name: Run complete test suite
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m pytest -q
          python -m compileall -q src tests
          node --check src/open_dachs_manager/web/app.js
          bash -n install.sh uninstall.sh
          python -m py_compile scripts/open-dachs-update-helper.py
      - name: Build twice in fresh trees and compare exact bytes
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          rm -rf /tmp/odm-a /tmp/odm-b /tmp/dist-a /tmp/dist-b dist
          mkdir -p /tmp/odm-a /tmp/odm-b /tmp/dist-a /tmp/dist-b dist
          git archive "$GITHUB_SHA" | tar -x -C /tmp/odm-a
          git archive "$GITHUB_SHA" | tar -x -C /tmp/odm-b
          (cd /tmp/odm-a && SOURCE_DATE_EPOCH="$epoch" python -m build --wheel --no-isolation -o /tmp/dist-a)
          (cd /tmp/odm-b && SOURCE_DATE_EPOCH="$epoch" python -m build --wheel --no-isolation -o /tmp/dist-b)
          cmp /tmp/dist-a/*.whl /tmp/dist-b/*.whl
          sha256sum /tmp/dist-a/*.whl /tmp/dist-b/*.whl
          cp /tmp/dist-a/*.whl dist/
          python - <<'PY'
          import base64,csv,hashlib,io,os,pathlib,re,zipfile
          wheels=list(pathlib.Path("dist").glob("*.whl")); assert len(wheels)==1
          wheel=wheels[0]; version=os.environ["GITHUB_REF_NAME"][1:]
          assert wheel.name==f"open_dachs_manager-{version}-py3-none-any.whl"
          forbidden=re.compile(r"(^|/)(tests?|\.git|\.env|.*\.(?:db|sqlite|log|key))($|/)",re.I)
          with zipfile.ZipFile(wheel) as z:
            names=z.namelist(); assert len(names)==len(set(names)); assert not any(forbidden.search(n) for n in names)
            assert "open_dachs_manager/data/update_release_public_key.pem" in names
            record=next(n for n in names if n.endswith(".dist-info/RECORD")); seen=set()
            for name,digest,size in csv.reader(io.StringIO(z.read(record).decode())):
              assert name not in seen; seen.add(name)
              if name==record: assert digest==size==""; continue
              raw=z.read(name); actual=base64.urlsafe_b64encode(hashlib.sha256(raw).digest()).rstrip(b"=").decode()
              assert digest=="sha256="+actual and int(size)==len(raw)
            assert seen==set(names)
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: {name: release-wheel, path: "dist/*.whl", if-no-files-found: error, retention-days: 1}
  release:
    needs: test-and-build
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: release-wheel, path: dist}
      - name: Create signed canonical stable release
        env:
          GH_TOKEN: ${{ github.token }}
          ODM_RELEASE_SIGNING_KEY: ${{ secrets.ODM_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$ODM_RELEASE_SIGNING_KEY"
          tag="$GITHUB_REF_NAME"; version="$(printf %s "$tag" | cut -c2-)"
          test "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA"
          wheel="dist/open_dachs_manager-$version-py3-none-any.whl"; test -f "$wheel"
          release_json="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Open Dachs Manager $version" -F draft=true -F prerelease=false -F generate_release_notes=true)"
          release_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$release_json")"
          gh release upload "$tag" "$wheel"
          published_json="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=false)"
          export tag version release_id GITHUB_SHA
          export wheel_size="$(stat -c %s "$wheel")" wheel_sha="$(sha256sum "$wheel" | cut -d' ' -f1)"
          export published_at="$(python -c 'import json,sys; print(json.load(sys.stdin)["published_at"])' <<<"$published_json")"
          python - <<'PY'
          import hashlib,json,os,pathlib
          metadata=json.loads(pathlib.Path("release-metadata.json").read_text())["releases"][os.environ["version"]]
          value={"schema":"open-dachs-release/v1","repo":"x3muha/open-dachs-manager","version":os.environ["version"],"tag":os.environ["tag"],"release_id":int(os.environ["release_id"]),"commit":os.environ["GITHUB_SHA"],"wheel":f"open_dachs_manager-{os.environ['version']}-py3-none-any.whl","wheel_size":int(os.environ["wheel_size"]),"wheel_sha256":os.environ["wheel_sha"],"dependency_fingerprint":hashlib.sha256(b"pyserial>=3.5\nreportlab>=4.2\n").hexdigest(),"published_at":os.environ["published_at"],**metadata}
          pathlib.Path("open_dachs_update_manifest.json").write_bytes(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode())
          PY
          umask 077; printf '%s\n' "$ODM_RELEASE_SIGNING_KEY" > signing-key.pem
          /usr/bin/openssl pkeyutl -sign -inkey signing-key.pem -rawin -in open_dachs_update_manifest.json -out open_dachs_update_manifest.sig
          rm -f signing-key.pem
          /usr/bin/openssl pkeyutl -verify -pubin -inkey src/open_dachs_manager/data/update_release_public_key.pem -sigfile open_dachs_update_manifest.sig -rawin -in open_dachs_update_manifest.json
          gh release upload "$tag" open_dachs_update_manifest.json open_dachs_update_manifest.sig
          rm -rf /tmp/verified-release-assets; mkdir /tmp/verified-release-assets
          gh release download "$tag" --dir /tmp/verified-release-assets
          cmp "$wheel" "/tmp/verified-release-assets/$(basename "$wheel")"
          cmp open_dachs_update_manifest.json /tmp/verified-release-assets/open_dachs_update_manifest.json
          cmp open_dachs_update_manifest.sig /tmp/verified-release-assets/open_dachs_update_manifest.sig
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > /tmp/release.json
          python - <<'PY'
          import json,os,pathlib
          release=json.loads(pathlib.Path("/tmp/release.json").read_text())
          assert release["tag_name"]==os.environ["tag"] and release["target_commitish"]==os.environ["GITHUB_SHA"]
          assert release["draft"] is False and release["prerelease"] is False and release["published_at"]==os.environ["published_at"]
          expected={f"open_dachs_manager-{os.environ['version']}-py3-none-any.whl","open_dachs_update_manifest.json","open_dachs_update_manifest.sig"}
          assets=release["assets"]; assert len(assets)==3 and {a["name"] for a in assets}==expected
          PY
