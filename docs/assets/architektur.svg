<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Architektur des Open Dachs Manager</title>
  <desc id="desc">Weboberfläche, CLI und TUI teilen sich über eine FIFO-Warteschlange einen zentralen seriellen Worker. Messwerte und Wartungsberichte werden lokal gespeichert.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5f3"/>
      <stop offset="1" stop-color="#e6ecef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#183632" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#168a75"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="26" fill="url(#bg)"/>
  <text x="54" y="58" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#19272b">Eine serielle Verbindung – mehrere Oberflächen</text>
  <text x="54" y="88" font-family="Inter,Arial,sans-serif" font-size="16" fill="#687980">Alle Zugriffe laufen geordnet und vollständig nachvollziehbar durch denselben Worker.</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="54" y="130" width="205" height="74" rx="13" fill="#fff" stroke="#cbd8d6"/>
    <circle cx="91" cy="167" r="18" fill="#d7f0e9"/>
    <path d="M82 167h18M91 158v18" stroke="#168a75" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="162" font-size="19" font-weight="700" fill="#19272b">Web</text>
    <text x="122" y="184" font-size="13" fill="#687980">Dashboard &amp; Wartung</text>

    <rect x="54" y="218" width="205" height="74" rx="13" fill="#fff" stroke="#cbd8d6"/>
    <circle cx="91" cy="255" r="18" fill="#d7f0e9"/>
    <text x="79" y="261" font-size="17" font-weight="700" fill="#168a75">&gt;_</text>
    <text x="122" y="250" font-size="19" font-weight="700" fill="#19272b">CLI</text>
    <text x="122" y="272" font-size="13" fill="#687980">Lesen &amp; Backups</text>

    <rect x="54" y="306" width="205" height="74" rx="13" fill="#fff" stroke="#cbd8d6"/>
    <circle cx="91" cy="343" r="18" fill="#d7f0e9"/>
    <rect x="80" y="333" width="22" height="18" rx="2" fill="none" stroke="#168a75" stroke-width="2"/>
    <text x="122" y="338" font-size="19" font-weight="700" fill="#19272b">TUI</text>
    <text x="122" y="360" font-size="13" fill="#687980">Bedienung im Terminal</text>

    <rect x="345" y="190" width="225" height="130" rx="17" fill="#164f46"/>
    <text x="458" y="226" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#8bd6c5">UNIX-SOCKET</text>
    <text x="458" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">FIFO-Warteschlange</text>
    <text x="458" y="289" text-anchor="middle" font-size="14" fill="#d7f0e9">Jede Sitzung bleibt atomar</text>

    <rect x="655" y="190" width="225" height="130" rx="17" fill="#fff" stroke="#cbd8d6"/>
    <text x="768" y="229" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#687980">EINZIGER ADAPTERZUGRIFF</text>
    <text x="768" y="263" text-anchor="middle" font-size="24" font-weight="700" fill="#19272b">Serialworker</text>
    <text x="768" y="291" text-anchor="middle" font-size="14" fill="#687980">CRC · ACK · Readback</text>

    <rect x="965" y="190" width="260" height="130" rx="17" fill="#fff" stroke="#cbd8d6"/>
    <text x="1095" y="229" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#687980">OPTISCH · RS232/USB</text>
    <text x="1095" y="263" text-anchor="middle" font-size="24" font-weight="700" fill="#19272b">Dachs MSR2</text>
    <text x="1095" y="291" text-anchor="middle" font-size="14" fill="#687980">Regler + Netzschutz-CPUs</text>

    <rect x="345" y="414" width="535" height="92" rx="17" fill="#fff" stroke="#cbd8d6"/>
    <text x="374" y="448" font-size="13" font-weight="700" letter-spacing="2" fill="#168a75">LOKAL AUF DEM PI</text>
    <text x="374" y="478" font-size="21" font-weight="700" fill="#19272b">SQLite · Messwerte · Audit · Wartungsberichte</text>
    <path d="M827 445h18v34h-18M799 452h20v27h-20M771 462h20v17h-20" fill="#d7f0e9" stroke="#168a75" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#168a75" stroke-width="4" marker-end="url(#arrow)">
    <path d="M259 167 C305 167 306 221 345 221"/>
    <path d="M259 255 H345"/>
    <path d="M259 343 C305 343 306 289 345 289"/>
    <path d="M570 255 H655"/>
    <path d="M880 255 H965"/>
    <path d="M768 320 V414"/>
  </g>
  <text x="925" y="244" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#168a75">SERIELL</text>
</svg>
